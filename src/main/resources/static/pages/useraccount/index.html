<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Account Management</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="./useraccount.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- ─── Navigation ──────────────────────────────────────────── -->
    <nav class="top-nav">
        <a href="../../index.html" class="nav-brand">
            <span class="brand-icon">◈</span> AAMS
        </a>
        <span class="nav-title">User Account Management</span>
    </nav>

    <!-- ─── Main Container ──────────────────────────────────────── -->
    <div class="container">

        <!-- Header Row -->
        <div class="page-header">
            <div class="header-text">
                <h1 id="page-title">User Accounts</h1>
                <p class="subtitle">Manage system users, roles, and permissions</p>
            </div>
            <button id="btn-add-user" class="btn btn-primary" onclick="openAddModal()">
                <span class="btn-icon">+</span> Add New User
            </button>
        </div>

        <!-- Stats Cards -->
        <div class="stats-row" id="stats-row">
            <div class="stat-card">
                <span class="stat-value" id="stat-total">0</span>
                <span class="stat-label">Total Users</span>
            </div>
            <div class="stat-card stat-active">
                <span class="stat-value" id="stat-active">0</span>
                <span class="stat-label">Active</span>
            </div>
            <div class="stat-card stat-inactive">
                <span class="stat-value" id="stat-inactive">0</span>
                <span class="stat-label">Inactive</span>
            </div>
            <div class="stat-card stat-admin">
                <span class="stat-value" id="stat-admin">0</span>
                <span class="stat-label">Admins</span>
            </div>
        </div>

        <!-- Search / Filter Bar -->
        <div class="toolbar">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="Search by name or email..."
                       oninput="handleSearch()" autocomplete="off">
            </div>
            <select id="filter-role" class="filter-select" onchange="handleFilter()">
                <option value="">All Roles</option>
                <option value="ADMIN">Admin</option>
                <option value="CLIENT">Client</option>
                <option value="STAFF">Staff</option>
            </select>
            <select id="filter-status" class="filter-select" onchange="handleFilter()">
                <option value="">All Status</option>
                <option value="ACTIVE">Active</option>
                <option value="INACTIVE">Inactive</option>
            </select>
        </div>

        <!-- Users Table -->
        <div class="table-wrapper">
            <table id="users-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="users-tbody">
                    <!-- Rows inserted by JS -->
                </tbody>
            </table>
            <div class="empty-state" id="empty-state" style="display:none;">
                <span class="empty-icon">👤</span>
                <p>No users found</p>
            </div>
        </div>
    </div>

    <!-- ─── Add / Edit Modal ────────────────────────────────────── -->
    <div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="modal-title">Add New User</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="user-form" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="form-user-id">

                <div class="form-row">
                    <div class="form-group">
                        <label for="form-firstName">First Name <span class="required">*</span></label>
                        <input type="text" id="form-firstName" required maxlength="50"
                               placeholder="Enter first name">
                    </div>
                    <div class="form-group">
                        <label for="form-lastName">Last Name <span class="required">*</span></label>
                        <input type="text" id="form-lastName" required maxlength="50"
                               placeholder="Enter last name">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="form-email">Email <span class="required">*</span></label>
                        <input type="email" id="form-email" required
                               placeholder="user@example.com">
                    </div>
                    <div class="form-group">
                        <label for="form-phone">Phone <span class="required">*</span></label>
                        <input type="tel" id="form-phone" required maxlength="15"
                               placeholder="+94771234567" pattern="^[+]?[0-9]{7,15}$">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="form-role">Role <span class="required">*</span></label>
                        <select id="form-role" required>
                            <option value="">Select role</option>
                            <option value="ADMIN">Admin</option>
                            <option value="CLIENT">Client</option>
                            <option value="STAFF">Staff</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="form-status">Status <span class="required">*</span></label>
                        <select id="form-status" required>
                            <option value="">Select status</option>
                            <option value="ACTIVE">Active</option>
                            <option value="INACTIVE">Inactive</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="form-password">Password <span class="required" id="pwd-required">*</span></label>
                    <input type="password" id="form-password" minlength="8"
                           placeholder="Minimum 8 characters">
                    <small class="form-hint" id="pwd-hint"></small>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btn-submit">
                        <span id="btn-submit-text">Create User</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ─── Delete Confirmation Modal ───────────────────────────── -->
    <div class="modal-overlay" id="delete-overlay" onclick="closeDeleteModal()">
        <div class="modal modal-sm" onclick="event.stopPropagation()">
            <div class="modal-header modal-header-danger">
                <h2>Confirm Deletion</h2>
                <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete <strong id="delete-user-name"></strong>?</p>
                <p class="text-muted">This action cannot be undone.</p>
            </div>
            <div class="form-actions">
                <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn btn-danger" id="btn-confirm-delete" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <!-- ─── Toast Notification ──────────────────────────────────── -->
    <div class="toast" id="toast">
        <span id="toast-message"></span>
    </div>

    <script src="../../js/main.js"></script>
    <script src="./useraccount.js"></script>
</body>
</html>
