spring.application.name=advertising-agency-management-system

# PostgreSQL connection - update credentials for your local setup
spring.datasource.url=jdbc:postgresql://localhost:5433/aams_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.open-in-view=false

server.port=8080

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=src/main/resources/static/uploads
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB
