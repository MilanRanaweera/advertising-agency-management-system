spring.application.name=axiom
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/axiom-db}
spring.datasource.username=${DB_USER:axiom}
spring.datasource.password=${DB_PASSWORD:axiom@2026}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.error.include-message=always
axiom.demo=${AXIOM_DEMO:true}
axiom.upload-dir=${UPLOAD_DIR:./uploads}
axiom.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_TLS:false}
axiom.mail.from=${MAIL_FROM:studio@example.test}
spring.jackson.serialization.write-dates-as-timestamps=false

# Configure these with your real agency details before issuing quotations.
axiom.studio.name=${STUDIO_NAME:AXIOM STUDIO}
axiom.studio.address=${STUDIO_ADDRESS:Colombo, Sri Lanka}
axiom.studio.email=${STUDIO_EMAIL:studio@example.test}
axiom.studio.phone=${STUDIO_PHONE:+94 11 000 0000}
